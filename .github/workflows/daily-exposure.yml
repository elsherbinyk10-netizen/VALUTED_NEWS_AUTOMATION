name: Valuted News Daily Exposure Pack

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * *" # 19:30 Cairo during UTC+2

permissions:
  contents: read

concurrency:
  group: valuted-news-exposure-pack
  cancel-in-progress: false

jobs:
  build-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_API_VERSION: "2026-10"
      SHOPIFY_BLOG_ID: "gid://shopify/Blog/126010065175"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate exposure generator
        run: python -m py_compile exposure_pack.py news_worker.py
      - name: Build SEO audit and social-ready copy for latest published articles
        run: python exposure_pack.py --limit 10
      - name: Upload daily exposure pack
        uses: actions/upload-artifact@v4
        with:
          name: valuted-news-exposure-${{ github.run_number }}
          path: exposure_output/
          if-no-files-found: error
          retention-days: 30
