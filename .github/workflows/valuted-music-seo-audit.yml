name: VALUTED MUSIC Daily SEO Audit

on:
  schedule:
    - cron: "0 20 * * *" # 10:00 PM Cairo during UTC+2 season; GitHub cron uses UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valuted-music-seo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4
      - name: Validate SEO audit Python syntax
        run: python -m py_compile music/seo_audit.py
      - name: Smoke-test sitemap XML parser import and extraction
        run: python -c "from music.seo_audit import xml_locations; assert xml_locations('<urlset><url><loc>https://valutedmusic.site/test</loc></url></urlset>') == ['https://valutedmusic.site/test']"
      - name: Authenticate with VALUTED MUSIC Shopify
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.VALUTED_MUSIC_SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.VALUTED_MUSIC_SHOPIFY_CLIENT_SECRET }}
        run: python music/shopify_auth.py
      - name: Run read-only SEO audit
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          SHOPIFY_API_VERSION: "2026-10"
          SEO_REPORT_DIR: seo-report
        run: python music/seo_audit.py
      - name: Retrofit existing official music video pages
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          SHOPIFY_API_VERSION: "2026-10"
          # Prefer the current name, but accept the legacy name used by earlier setup notes.
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY || secrets.VALUTED_MUSIC_YOUTUBE_DATA_API_KEY }}
          AUTO_PUBLISH: "true"
        run: |
          if [ -z "$YOUTUBE_DATA_API_KEY" ]; then
            echo "::warning::Neither YOUTUBE_DATA_API_KEY nor VALUTED_MUSIC_YOUTUBE_DATA_API_KEY is configured; video-page retrofit skipped safely."
          else
            python -m py_compile music/video_seo_audit.py
            python music/video_seo_audit.py
          fi
      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valuted-music-seo-report
          path: seo-report/
          if-no-files-found: warn
          retention-days: 30
