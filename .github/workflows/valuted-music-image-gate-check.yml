name: VALUTED MUSIC Image Gate Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "music/**"
      - ".github/workflows/valuted-music-image-gate-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all music automation workers
        run: |
          python -m py_compile music/worker.py
          python -m py_compile music/video_worker.py
          python -m py_compile music/catalog_worker.py
