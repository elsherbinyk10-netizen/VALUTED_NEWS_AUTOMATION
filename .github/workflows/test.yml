name: Valuted News Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "news_worker.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile news_worker.py backfill_video.py backfill_media.py audit_repair_images.py
      - name: Run unit tests without publishing
        run: python -m unittest discover -s tests -v
