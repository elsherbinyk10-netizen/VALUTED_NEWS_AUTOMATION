name: Valuted News Translation Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "translate_news.py"
      - ".github/workflows/translation-automation.yml"
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: write

concurrency:
  group: valuted-news-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_API_VERSION: "2026-10"
      SHOPIFY_BLOG_ID: "gid://shopify/Blog/126010065175"
      TRANSLATION_MAX_RESOURCES_PER_RUN: ${{ vars.TRANSLATION_MAX_RESOURCES_PER_RUN || '4' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate translation script
        run: python -m py_compile translate_news.py news_worker.py

      - name: Translate published articles and pages
        run: python translate_news.py

      - name: Persist translation queue progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/translation_state.json
          if git diff --cached --quiet; then
            echo "No translation progress to save."
            exit 0
          fi
          git commit -m "Save translation queue progress [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Concurrent repository update; retrying state push ($attempt/3)."
            sleep 2
          done
          echo "Could not persist translation state after three attempts."
          exit 1
