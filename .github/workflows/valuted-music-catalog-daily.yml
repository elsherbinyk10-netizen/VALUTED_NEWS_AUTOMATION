name: VALUTED MUSIC Daily Catalogue Expansion
on:
  schedule:
    - cron: "30 19 * * *" # 9:00 PM Cairo
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish verified catalogue entries (otherwise discovery-only dry run)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: valuted-music-catalog-daily
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Discover music catalogue records
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.VALUTED_MUSIC_SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: "2026-10"
          MAX_CATALOG_ITEMS: "30"
          AUTO_PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: python music/catalog_worker.py
