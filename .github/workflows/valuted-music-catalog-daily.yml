name: VALUTED MUSIC Daily Catalogue Expansion

on:
  schedule:
    # Daily 9 PM Cairo (UTC+2)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valuted-music-catalog-daily
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Discover and publish artist, album and song pages
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.VALUTED_MUSIC_SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: "2026-10"
          MAX_CATALOG_ITEMS: "15"
        run: python music/catalog_worker.py
