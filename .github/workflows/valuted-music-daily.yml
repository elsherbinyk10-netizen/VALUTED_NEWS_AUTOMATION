name: VALUTED MUSIC Daily Music News

on:
  schedule:
    # 9:00 PM Cairo (UTC+2)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valuted-music-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests feedparser beautifulsoup4

      - name: Verify target configuration and publish
        env:
          SHOPIFY_SHOP_DOMAIN: valutedmusic.site
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.VALUTED_MUSIC_SHOPIFY_ADMIN_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHOPIFY_API_VERSION: "2026-10"
          MAX_ARTICLES_PER_RUN: "5"
          MAX_AGE_HOURS: "36"
          AUTO_PUBLISH: "true"
          OPENAI_MODEL: "gpt-4.1-mini"
        run: python music/worker.py
