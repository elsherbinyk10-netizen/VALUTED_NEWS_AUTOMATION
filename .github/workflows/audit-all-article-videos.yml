name: Valuted News Full Article Video Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["audit_all_video_embeds.py", ".github/workflows/audit-all-article-videos.yml"]

permissions:
  contents: read

concurrency:
  group: valuted-news-full-video-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_API_VERSION: "2026-10"
      SHOPIFY_BLOG_ID: "gid://shopify/Blog/107387158765"
      PUBLIC_STORE_DOMAIN: "valutednews.com"
    steps:
      - uses: actions/checkout@v4
      - name: Obtain temporary Shopify Admin API token
        shell: bash
        run: |
          set -euo pipefail
          test "$SHOPIFY_STORE_DOMAIN" = "5xd8ae-md.myshopify.com" || { echo "Unexpected Shopify store domain"; exit 1; }
          test -n "$SHOPIFY_API_KEY" || { echo "Missing SHOPIFY_API_KEY"; exit 1; }
          test -n "$SHOPIFY_API_SECRET" || { echo "Missing SHOPIFY_API_SECRET"; exit 1; }
          response=$(curl --fail --silent --show-error \
            -X POST "https://${SHOPIFY_STORE_DOMAIN}/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${SHOPIFY_API_KEY}" \
            --data-urlencode "client_secret=${SHOPIFY_API_SECRET}")
          token=$(printf '%s' "$response" | jq -er '.access_token')
          printf '%s' "$response" | jq -e '(.scope // "" | split(",") | map(gsub("^\\s+|\\s+$"; ""))) | index("write_content") != null' >/dev/null || { echo "Shopify token is missing write_content"; exit 1; }
          echo "::add-mask::$token"
          echo "SHOPIFY_ADMIN_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Valuted News Shopify token and write scope verified."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate video audit syntax
        run: python -m py_compile audit_all_video_embeds.py backfill_video.py news_worker.py publisher_video.py
      - name: Audit every published article and repair verified broken embeds
        run: python audit_all_video_embeds.py
