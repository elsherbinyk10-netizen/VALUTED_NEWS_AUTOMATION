name: Valuted News RSS Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news_worker.py"
      - "backfill_media.py"
      - "backfill_video.py"
      - "audit_repair_images.py"
      - "tests/**"
      - "requirements.txt"
      - "feeds.json"
      - ".github/workflows/news-collector.yml"
  schedule:
    - cron: "17 6,12,18 * * *" # Recovery trigger requested on 2026-10-22

permissions:
  contents: write

concurrency:
  group: valuted-news-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      
      SHOPIFY_API_VERSION: "2026-10"
      AUTO_PUBLISH: 'true'
      SHOPIFY_BLOG_ID: "gid://shopify/Blog/126010065175"
      MAX_ARTICLES_PER_RUN: '3'
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '36' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "$SHOPIFY_STORE_DOMAIN" || { echo "Missing repository secret SHOPIFY_STORE_DOMAIN"; exit 1; }
          test -n "$SHOPIFY_ADMIN_ACCESS_TOKEN" || { test -n "$SHOPIFY_CLIENT_ID" || { echo "Missing SHOPIFY_ADMIN_ACCESS_TOKEN or SHOPIFY_CLIENT_ID"; exit 1; }; test -n "$SHOPIFY_CLIENT_SECRET" || { echo "Missing SHOPIFY_CLIENT_SECRET"; exit 1; }; }
          test -f feeds.json || { echo "feeds.json is missing"; exit 1; }

      - name: Validate Python syntax
        run: python -m py_compile news_worker.py backfill_video.py backfill_media.py audit_repair_images.py

      - name: Test video embed and editorial safety
        run: python -m unittest discover -s tests -v

      - name: Run RSS collector
        run: python news_worker.py

      - name: Add relevant videos to published articles
        env:
          VIDEO_BACKFILL_LIMIT: ${{ vars.VIDEO_BACKFILL_LIMIT || '250' }}
        run: python backfill_video.py

      - name: Backfill missing or generic featured images
        env:
          MEDIA_BACKFILL_LIMIT: ${{ vars.MEDIA_BACKFILL_LIMIT || '100' }}
        run: python backfill_media.py

      - name: Audit and repair missing, broken, placeholder, or widely reused article images
        env:
          MEDIA_BACKFILL_LIMIT: ${{ vars.MEDIA_BACKFILL_LIMIT || '100' }}
        run: python audit_repair_images.py

      - name: Commit deduplication state safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          cp data/processed.json /tmp/processed-local.json
          if [ -f data/video_backfill.json ]; then cp data/video_backfill.json /tmp/video-backfill-local.json; else printf '{"attempted":{}}\n' > /tmp/video-backfill-local.json; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          local = json.loads(Path("/tmp/processed-local.json").read_text())
          remote = json.loads(Path("data/processed.json").read_text())
          merged = dict(remote)
          merged["version"] = max(int(local.get("version", 1)), int(remote.get("version", 1)))
          items = dict(remote.get("items", {}))
          for key, value in local.get("items", {}).items():
              old = items.get(key)
              if old is None or str(value.get("seen_at", "")) >= str(old.get("seen_at", "")):
                  items[key] = value
          merged["items"] = items
          Path("data/processed.json").write_text(json.dumps(merged, indent=2, sort_keys=True))
          local_video = json.loads(Path("/tmp/video-backfill-local.json").read_text())
          video_path = Path("data/video_backfill.json")
          remote_video = json.loads(video_path.read_text()) if video_path.exists() else {"attempted": {}}
          merged_attempts = dict(remote_video.get("attempted", {}))
          for key, value in local_video.get("attempted", {}).items():
              if key not in merged_attempts or str(value) >= str(merged_attempts[key]):
                  merged_attempts[key] = value
          video_path.write_text(json.dumps({"attempted": merged_attempts}, indent=2, sort_keys=True))
          print(f"Merged video attempt state: {len(merged_attempts)} articles")
          print(f"Merged deduplication state: {len(items)} unique items")
          PY
            git add data/processed.json data/video_backfill.json
            if git diff --cached --quiet; then
              echo "No processing-state changes to commit."
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+users.noreply.github.com" commit -m "Update news processing state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against latest main."
          done
          echo "Unable to push merged processing state after 3 attempts."
          exit 1
