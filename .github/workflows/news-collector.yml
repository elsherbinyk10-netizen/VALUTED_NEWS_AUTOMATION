name: Valuted News RSS Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: valuted-news-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
      SHOPIFY_BLOG_ID: ${{ vars.SHOPIFY_BLOG_ID }}
      MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '3' }}
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '36' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "$SHOPIFY_STORE_DOMAIN" || { echo "Missing repository secret SHOPIFY_STORE_DOMAIN"; exit 1; }
          test -n "$SHOPIFY_ADMIN_ACCESS_TOKEN" || { echo "Missing repository secret SHOPIFY_ADMIN_ACCESS_TOKEN"; exit 1; }
          test -n "$SHOPIFY_BLOG_ID" || { echo "Missing repository variable SHOPIFY_BLOG_ID"; exit 1; }
          test -f feeds.json || { echo "feeds.json is missing"; exit 1; }

      - name: Run RSS collector
        run: python news_worker.py

      - name: Commit deduplication state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/processed.json
          if git diff --cached --quiet; then
            echo "No processing-state changes to commit."
          else
            git commit -m "Update news processing state [skip ci]"
            git push
          fi
