name: Valuted News RSS Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news_worker.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/news-collector.yml"
  schedule:
    - cron: "17 6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: valuted-news-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      
      SHOPIFY_API_VERSION: "2026-10"
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      SHOPIFY_BLOG_ID: "gid://shopify/Blog/126010065175"
      MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '3' }}
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '36' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "$SHOPIFY_STORE_DOMAIN" || { echo "Missing repository secret SHOPIFY_STORE_DOMAIN"; exit 1; }
          test -n "$SHOPIFY_ADMIN_ACCESS_TOKEN" || { test -n "$SHOPIFY_CLIENT_ID" || { echo "Missing SHOPIFY_ADMIN_ACCESS_TOKEN or SHOPIFY_CLIENT_ID"; exit 1; }; test -n "$SHOPIFY_CLIENT_SECRET" || { echo "Missing SHOPIFY_CLIENT_SECRET"; exit 1; }; }
          test -f feeds.json || { echo "feeds.json is missing"; exit 1; }

      - name: Validate Python syntax
        run: python -m py_compile news_worker.py

      - name: Test video embed and editorial safety
        run: python -m unittest discover -s tests -v

      - name: Run RSS collector
        run: python news_worker.py

      - name: Commit deduplication state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/processed.json
          if git diff --cached --quiet; then
            echo "No processing-state changes to commit."
          else
            git commit -m "Update news processing state [skip ci]"
            git push
          fi
