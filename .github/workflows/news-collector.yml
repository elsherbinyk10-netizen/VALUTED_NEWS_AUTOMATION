name: Valuted News RSS Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news_worker.py"
      - "article_quality.py"
      - "publisher_video.py"
      - "backfill_media.py"
      - "backfill_video.py"
      - "audit_repair_images.py"
      - "audit_repair_articles.py"
      - "restore_news_archive.py"
      - "image_quality.py"
      - "tests/**"
      - "requirements.txt"
      - "feeds.json"
      - ".github/workflows/news-collector.yml"
  schedule:
    - cron: "17 6,12,18 * * *" # Primary publishing windows
    # Independent recovery checks roughly 90 minutes after each primary run.
    - cron: "47 7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: valuted-news-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      
      SHOPIFY_API_VERSION: "2026-10"
      AUTO_PUBLISH: 'true'
      SHOPIFY_BLOG_ID: "gid://shopify/Blog/107387158765"
      MAX_ARTICLES_PER_RUN: '5'
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '36' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Obtain temporary Shopify Admin API token
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPIFY_STORE_DOMAIN" || { echo "Missing repository secret SHOPIFY_STORE_DOMAIN"; exit 1; }
          test "$SHOPIFY_STORE_DOMAIN" = "5xd8ae-md.myshopify.com" || { echo "SHOPIFY_STORE_DOMAIN must be exactly 5xd8ae-md.myshopify.com"; exit 1; }
          test -n "$SHOPIFY_API_KEY" || { echo "Missing repository secret SHOPIFY_API_KEY"; exit 1; }
          test -n "$SHOPIFY_API_SECRET" || { echo "Missing repository secret SHOPIFY_API_SECRET"; exit 1; }

          response=$(curl --fail --silent --show-error \
            -X POST "https://${SHOPIFY_STORE_DOMAIN}/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${SHOPIFY_API_KEY}" \
            --data-urlencode "client_secret=${SHOPIFY_API_SECRET}")

          token=$(printf '%s' "$response" | jq -er '.access_token')
          expires=$(printf '%s' "$response" | jq -er '.expires_in')
          scope=$(printf '%s' "$response" | jq -r '.scope // ""')

          if ! printf '%s' "$response" | jq -e '
            (.scope // "" | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $scopes
            | ($scopes | index("write_content")) != null
          ' >/dev/null; then
            echo "Shopify token is missing the required write_content scope (which also grants content read access)."
            echo "Granted scopes: ${scope:-not returned}"
            exit 1
          fi

          echo "::add-mask::$token"
          echo "SHOPIFY_ADMIN_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Temporary Shopify token obtained. Expires in ${expires} seconds."
          echo "Required content scopes verified."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies with transient-failure retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install --disable-pip-version-check --upgrade pip && python -m pip install --disable-pip-version-check -r requirements.txt && exit 0
            echo "Dependency installation attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Validate required configuration
        shell: bash
        run: |
          test "$SHOPIFY_STORE_DOMAIN" = "5xd8ae-md.myshopify.com" || { echo "SHOPIFY_STORE_DOMAIN must be exactly 5xd8ae-md.myshopify.com"; exit 1; }
          test -n "$SHOPIFY_ADMIN_ACCESS_TOKEN" || { echo "Temporary Shopify token was not provided to the publishing job."; exit 1; }
          test -f feeds.json || { echo "feeds.json is missing"; exit 1; }

      - name: Validate Python syntax
        run: python -m py_compile news_worker.py article_quality.py image_quality.py publisher_video.py backfill_video.py backfill_media.py audit_repair_images.py audit_repair_articles.py restore_news_archive.py

      - name: Test video embed and editorial safety
        run: python -m unittest discover -s tests -v

      - name: Run article text-integrity checks
        run: python -m unittest discover -s tests -p 'test_article_quality.py' -v

      - name: Repair reversible text corruption and duplicate source footers in existing articles
        run: python audit_repair_articles.py

      - name: Run RSS collector
        run: python news_worker.py

      - name: Restore historical articles from verified RSS and publisher media
        env:
          ARCHIVE_RESTORE_PER_RUN: '15'
        run: python restore_news_archive.py

      - name: Add relevant videos to published articles
        env:
          VIDEO_BACKFILL_LIMIT: ${{ vars.VIDEO_BACKFILL_LIMIT || '250' }}
        run: |
          for attempt in 1 2 3; do
            python backfill_video.py && exit 0
            echo "Video backfill attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Backfill missing, generic, and low-resolution featured images
        env:
          MEDIA_BACKFILL_LIMIT: ${{ vars.MEDIA_BACKFILL_LIMIT || '100' }}
        run: |
          for attempt in 1 2 3; do
            python backfill_media.py && exit 0
            echo "Image backfill attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Audit and repair missing, broken, placeholder, reused, or low-resolution article images
        env:
          MEDIA_BACKFILL_LIMIT: ${{ vars.MEDIA_BACKFILL_LIMIT || '100' }}
        run: |
          for attempt in 1 2 3; do
            python audit_repair_images.py && exit 0
            echo "Image audit/repair attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Commit deduplication state safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          cp data/processed.json /tmp/processed-local.json
          if [ -f data/video_backfill.json ]; then cp data/video_backfill.json /tmp/video-backfill-local.json; else printf '{"attempted":{}}\n' > /tmp/video-backfill-local.json; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          local = json.loads(Path("/tmp/processed-local.json").read_text())
          remote = json.loads(Path("data/processed.json").read_text())
          merged = dict(remote)
          merged["version"] = max(int(local.get("version", 1)), int(remote.get("version", 1)))
          items = dict(remote.get("items", {}))
          for key, value in local.get("items", {}).items():
              old = items.get(key)
              if old is None or str(value.get("seen_at", "")) >= str(old.get("seen_at", "")):
                  items[key] = value
          merged["items"] = items
          Path("data/processed.json").write_text(json.dumps(merged, indent=2, sort_keys=True))
          local_video = json.loads(Path("/tmp/video-backfill-local.json").read_text())
          video_path = Path("data/video_backfill.json")
          remote_video = json.loads(video_path.read_text()) if video_path.exists() else {"attempted": {}}
          merged_attempts = dict(remote_video.get("attempted", {}))
          for key, value in local_video.get("attempted", {}).items():
              if key not in merged_attempts or str(value) >= str(merged_attempts[key]):
                  merged_attempts[key] = value
          video_path.write_text(json.dumps({"attempted": merged_attempts}, indent=2, sort_keys=True))
          print(f"Merged video attempt state: {len(merged_attempts)} articles")
          print(f"Merged deduplication state: {len(items)} unique items")
          PY
            git add data/processed.json data/video_backfill.json
            if git diff --cached --quiet; then
              echo "No processing-state changes to commit."
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+users.noreply.github.com" commit -m "Update news processing state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against latest main."
          done
          echo "Unable to push merged processing state after 3 attempts."
          exit 1
