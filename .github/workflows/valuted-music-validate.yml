name: VALUTED MUSIC Code Validation
on:
  pull_request:
    paths:
      - "music/**"
      - ".github/workflows/valuted-music-*.yml"
      - "tests/test_valuted_music_*.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install requests feedparser beautifulsoup4
      - name: Check Python syntax
        run: python -m py_compile music/video_worker.py music/catalog_worker.py
      - name: Run Music workflow unit tests
        run: python -m unittest discover -s tests -p "test_valuted_music_*.py" -v
      - name: Check Radar JavaScript and static assets
        run: node --check music/radar-browser/radar.js && test -s music/radar-browser/index.html && test -s music/radar-browser/styles.css && test -s music/radar-browser/library.json
      - name: Validate official channel allowlist
        run: |
          python - <<'PY'
          import json, re
          data = json.load(open("music/official_channels.json", encoding="utf-8"))
          assert data.get("channels"), "Official channel allowlist is empty"
          seen = set()
          for item in data["channels"]:
              assert re.fullmatch(r"UC[A-Za-z0-9_-]{22}", item["channel_id"]), item
              assert item["channel_id"] not in seen, "Duplicate channel ID"
              assert item.get("label"), "Channel label required"
              seen.add(item["channel_id"])
          print(f"Validated {len(seen)} allowlisted official channels")
          PY
