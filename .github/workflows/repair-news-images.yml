name: Valuted News Image Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-news-images.yml"
      - "backfill_media.py"
      - "audit_repair_images.py"
      - "image_quality.py"
      - "publisher_image_policy.py"
      - "requirements.txt"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: valuted-news-image-repair
  cancel-in-progress: false

jobs:
  repair-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_API_VERSION: "2026-10"
      SHOPIFY_BLOG_ID: "gid://shopify/Blog/107387158765"
      PUBLIC_STORE_DOMAIN: "valutednews.com"
      MEDIA_BACKFILL_LIMIT: "100"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Obtain temporary Shopify Admin API token
        shell: bash
        run: |
          set -euo pipefail
          test "$SHOPIFY_STORE_DOMAIN" = "5xd8ae-md.myshopify.com" || { echo "Unexpected Shopify store domain"; exit 1; }
          test -n "$SHOPIFY_API_KEY" || { echo "Missing SHOPIFY_API_KEY"; exit 1; }
          test -n "$SHOPIFY_API_SECRET" || { echo "Missing SHOPIFY_API_SECRET"; exit 1; }
          response=$(curl --fail --silent --show-error \
            -X POST "https://${SHOPIFY_STORE_DOMAIN}/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${SHOPIFY_API_KEY}" \
            --data-urlencode "client_secret=${SHOPIFY_API_SECRET}")
          token=$(printf '%s' "$response" | jq -er '.access_token')
          printf '%s' "$response" | jq -e '(.scope // "" | split(",") | map(gsub("^\\s+|\\s+$"; ""))) | index("write_content") != null' >/dev/null || { echo "Shopify token is missing write_content"; exit 1; }
          echo "::add-mask::$token"
          echo "SHOPIFY_ADMIN_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Valuted News Shopify token and write scope verified."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$SHOPIFY_STORE_DOMAIN" || { echo "Missing SHOPIFY_STORE_DOMAIN"; exit 1; }
          test "$SHOPIFY_BLOG_ID" = "gid://shopify/Blog/107387158765" || { echo "Wrong target blog ID"; exit 1; }
          test -n "$SHOPIFY_ADMIN_ACCESS_TOKEN" || { echo "Temporary Shopify token was not provided"; exit 1; }
      - name: Validate syntax and safety tests
        run: |
          python -m py_compile news_worker.py image_quality.py publisher_image_policy.py backfill_media.py audit_repair_images.py
          python -m unittest discover -s tests -v
      - name: Repair missing, generic, and low-resolution featured images
        run: python backfill_media.py
      - name: Audit and repair broken, placeholder, reused, or low-resolution images
        run: python audit_repair_images.py
