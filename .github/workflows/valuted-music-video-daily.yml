name: VALUTED MUSIC Official Video Publisher

on:
  schedule:
    # 9:00 PM Cairo (UTC+2)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valuted-music-video-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests feedparser beautifulsoup4
      - name: Verify official channels and publish videos
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.VALUTED_MUSIC_SHOPIFY_ADMIN_ACCESS_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.VALUTED_MUSIC_YOUTUBE_DATA_API_KEY }}
          SHOPIFY_API_VERSION: "2026-10"
          MAX_VIDEOS_PER_RUN: "5"
          MAX_VIDEO_AGE_HOURS: "72"
          AUTO_PUBLISH: "true"
        run: python music/video_worker.py
