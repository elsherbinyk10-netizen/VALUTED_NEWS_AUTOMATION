name: VALUTED MUSIC Official Video Publisher

on:
  schedule:
    - cron: "0 19 * * *" # 9:00 PM Cairo
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish verified videos (otherwise discovery-only dry run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: valuted-music-video-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests feedparser beautifulsoup4
      - name: Authenticate with Shopify Dev Dashboard
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.VALUTED_MUSIC_SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.VALUTED_MUSIC_SHOPIFY_CLIENT_SECRET }}
        run: python music/shopify_auth.py
      - name: Verify official channels and discover candidates
        env:
          SHOPIFY_ADMIN_DOMAIN: ${{ vars.VALUTED_MUSIC_SHOPIFY_ADMIN_DOMAIN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.VALUTED_MUSIC_YOUTUBE_DATA_API_KEY }}
          SHOPIFY_API_VERSION: "2026-10"
          MAX_VIDEOS_PER_RUN: "2"
          MAX_VIDEO_AGE_HOURS: "72"
          AUTO_PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: python music/video_seo_audit.py && python music/video_worker.py
