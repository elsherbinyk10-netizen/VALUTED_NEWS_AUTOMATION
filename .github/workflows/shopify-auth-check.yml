name: Shopify Authentication Check

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Obtain temporary Shopify token
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOPIFY_STORE_DOMAIN"
          test -n "$SHOPIFY_API_KEY"
          test -n "$SHOPIFY_API_SECRET"

          response=$(curl --fail --silent --show-error \
            -X POST "https://${SHOPIFY_STORE_DOMAIN}/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${SHOPIFY_API_KEY}" \
            --data-urlencode "client_secret=${SHOPIFY_API_SECRET}")

          token=$(printf '%s' "$response" | jq -er '.access_token')
          expires=$(printf '%s' "$response" | jq -r '.expires_in')
          scope=$(printf '%s' "$response" | jq -r '.scope // "not returned"')

          echo "::add-mask::$token"
          echo "SHOPIFY_ADMIN_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Temporary token obtained. Expires in ${expires} seconds."
          echo "Granted scopes: ${scope}"

      - name: Verify Shopify store and blog access
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_API_VERSION: "2026-10"
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg query 'query { shop { name myshopifyDomain } blogs(first: 20) { edges { node { id title handle } } } }' \
            '{query: $query}')

          result=$(curl --fail --silent --show-error \
            -X POST "https://${SHOPIFY_STORE_DOMAIN}/admin/api/${SHOPIFY_API_VERSION}/graphql.json" \
            -H "Content-Type: application/json" \
            -H "X-Shopify-Access-Token: ${SHOPIFY_ADMIN_ACCESS_TOKEN}" \
            --data "$payload")

          if [ "$(printf '%s' "$result" | jq '.errors // [] | length')" -gt 0 ]; then
            echo "Shopify GraphQL returned errors."
            printf '%s' "$result" | jq '.errors'
            exit 1
          fi

          printf '%s' "$result" | jq '{shop: .data.shop, blogs: [.data.blogs.edges[].node]}'
